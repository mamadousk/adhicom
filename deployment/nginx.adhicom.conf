# Adhicom — configuration Nginx de référence (reverse proxy + TLS).
# Placer dans /etc/nginx/sites-available/adhicom.conf puis symlink vers sites-enabled.
# TLS : certbot --nginx -d adhicom.com -d www.adhicom.com -d '*.adhicom.com' -d app.adhicom.com -d admin.adhicom.com

# Redirection HTTP -> HTTPS (toutes les zones)
server {
    listen 80;
    listen [::]:80;
    server_name adhicom.com www.adhicom.com app.adhicom.com admin.adhicom.com *.adhicom.com;
    return 301 https://$host$request_uri;
}

# --- Zone boutiques publiques : {slug}.adhicom.com → conteneur web, chemin /storefront/{slug} ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ~^(?<slug>[a-z0-9-]+)\.adhicom\.com$;

    ssl_certificate     /etc/letsencrypt/live/adhicom.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adhicom.com/privkey.pem;

    # Sécurité
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    client_max_body_size 6m;

    location / {
        # Le sous-domaine est traduit en /storefront/{slug} par le conteneur (résolution applicative)
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

# --- Zone site + app + admin ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name adhicom.com www.adhicom.com app.adhicom.com admin.adhicom.com;

    ssl_certificate     /etc/letsencrypt/live/adhicom.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adhicom.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
